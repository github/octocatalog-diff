stages:
  - build
  - publish

default:
  image: ruby:3.2.11

variables:
  FF_SCRIPT_SECTIONS: "true"

build:gem:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - export VERSION=$(sed -n "s/^[[:space:]]*VERSION = [\"']\([^\"']*\)[\"'].*/\1/p" lib/octocatalog-diff/version.rb)
    - |
      if [ -z "${VERSION}" ]; then
        echo "ERROR: could not read VERSION from lib/octocatalog-diff/version.rb"
        exit 1
      fi
    - echo "Building octocatalog-diff version ${VERSION}"
  script:
    - |
      set -e
      for spec in *.gemspec; do
        echo "Building ${spec}... version ${VERSION}"
        gem build "${spec}"
      done
    - ls -l *.gem
  artifacts:
    name: "octocatalog-diff-${CI_COMMIT_REF_SLUG}"
    paths:
      - "*.gem"
    expire_in: 1 week

publish:gem:stage:
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  dependencies:
    - build:gem
  before_script:
    - export VERSION=$(sed -n "s/^[[:space:]]*VERSION = [\"']\([^\"']*\)[\"'].*/\1/p" lib/octocatalog-diff/version.rb)
    - |
      if [ -z "${VERSION}" ]; then
        echo "ERROR: could not read VERSION from lib/octocatalog-diff/version.rb"
        exit 1
      fi
    - |
      mkdir -p $HOME/.gem
      touch $HOME/.gem/credentials
      chmod 0600 $HOME/.gem/credentials
      printf -- "---\n:gemstash_stage: ${GEMSTASH_STAGE_API_KEY}\n" > $HOME/.gem/credentials
  script:
    - echo "Pushing octocatalog-diff ${VERSION} to Gemstash Stage server at ${GEMSTASH_STAGE_URL}..."
    - |
      set -e
      HOST="${GEMSTASH_STAGE_URL}/private"
      KEY="gemstash_stage"

      for GEM_FILE in *.gem; do
        echo "Pushing ${GEM_FILE} to ${HOST}..."

        set +e
        OUTPUT=$(gem push --verbose --key "${KEY}" --host "${HOST}" "${GEM_FILE}" 2>&1)
        STATUS=$?
        set -e

        echo "$OUTPUT"

        if [ $STATUS -ne 0 ]; then
          if echo "$OUTPUT" | grep -q "500 Internal Server Error"; then
            echo "NOTICE: Gemstash returned 500 for ${GEM_FILE}, version likely already exists. Skipping..."
          else
            echo "ERROR: gem push failed for ${GEM_FILE}."
            exit 1
          fi
        else
          echo "Push successful: ${GEM_FILE}"
        fi
      done

publish:gem:prod:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  dependencies:
    - build:gem
  before_script:
    - |
      export VERSION=$(sed -n "s/^[[:space:]]*VERSION = [\"']\([^\"']*\)[\"'].*/\1/p" lib/octocatalog-diff/version.rb)
      mkdir -p $HOME/.gem
      touch $HOME/.gem/credentials
      chmod 0600 $HOME/.gem/credentials
      printf -- "---\n:gemstash_prod: ${GEMSTASH_PROD_API_KEY}\n" > $HOME/.gem/credentials
  script:
    - echo "Pushing octocatalog-diff ${VERSION} to Gemstash Prod server at ${GEMSTASH_PROD_URL}..."
    - |
      set -e
      HOST="${GEMSTASH_PROD_URL}/private"
      KEY="gemstash_prod"

      for GEM_FILE in *.gem; do
        echo "Pushing ${GEM_FILE} to ${HOST}..."

        set +e
        OUTPUT=$(gem push --verbose --key "${KEY}" --host "${HOST}" "${GEM_FILE}" 2>&1)
        STATUS=$?
        set -e

        echo "$OUTPUT"

        if [ $STATUS -ne 0 ]; then
          if echo "$OUTPUT" | grep -q "500 Internal Server Error"; then
            echo "NOTICE: Gemstash returned 500 for ${GEM_FILE}, version likely already exists. Skipping..."
          else
            echo "ERROR: gem push failed for ${GEM_FILE}. Inspect manually."
            exit 1
          fi
        else
          echo "Push successful: ${GEM_FILE}"
        fi
      done
